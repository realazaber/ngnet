<section>
  <ngnet-container>
    <form
      class="mx-auto shadow-sm flex flex-col gap-y-1 border-[1px] rounded-sm py-5 px-3"
    >
      <input
        name="email"
        [(ngModel)]="formData.email"
        type="email"
        placeholder="Email"
      />
      <div class="flex flex-col sm:flex-row gap-y-1 sm:gap-x-1">
        <input
          name="fname"
          [(ngModel)]="formData.firstName"
          type="text"
          placeholder="First Name"
        />
        <input
          name="lname"
          [(ngModel)]="formData.lastName"
          type="text"
          placeholder="Last Name"
        />
      </div>
      <input name="profileImg" type="file" [(ngModel)]="formData.profileImg" />
      <input
        name="password"
        [(ngModel)]="formData.password"
        type="password"
        placeholder="Password"
      />
      <input
        name="confirmPassword"
        [(ngModel)]="formData.confirmPassword"
        type="password"
        placeholder="Confirm Password"
      />
      <input
        type="submit"
        (click)="register()"
        class="btn primary"
        value="Create Account"
      />
    </form>
  </ngnet-container>
</section>
