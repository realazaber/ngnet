<section>
  <ngnet-container>
    <h1>Profile</h1>
    <form action="">
      <div class="flex flex-row gap-x-1">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input
            [(ngModel)]="currentUser.firstName"
            type="text"
            name="firstName"
          />
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input
            [(ngModel)]="currentUser.lastName"
            type="text"
            name="lastName"
          />
        </div>
      </div>
      <div class="flex flex-row gap-x-1">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input [(ngModel)]="currentUser.phone" type="number" name="phone" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input [(ngModel)]="currentUser.email" type="email" name="email" />
        </div>
      </div>
      <div class="form-group">
        <label for="profileImg">Profile Picture</label>
        <input type="file" name="profileImg" />
      </div>
      <button
        (click)="update()"
        class="btn bg-yellow-400 text-white rounded-sm block m-3 font-bold"
      >
        Update profile
      </button>
    </form>
  </ngnet-container>
</section>
