<div class="flex flex-row gap-x-1">
  <form class="w-full sm:w-1/2">
    <div class="flex flex-row gap-x-1">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          [(ngModel)]="selectedUser.firstName"
        />
      </div>
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          [(ngModel)]="selectedUser.lastName"
        />
      </div>
    </div>
    <div class="flex flex-row gap-x-1">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="selectedUser.email"
        />
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input
          type="text"
          id="phone"
          name="phone"
          [(ngModel)]="selectedUser.phone"
        />
      </div>
    </div>
    <div>
      <span>Current Roles</span>
      <table>
        @if (selectedUser.roles.length === 0) {
        <span>No roles</span>
        } @for (role of selectedUser.roles; track $index) {
        <tr>
          <td>
            {{ role }}
          </td>
          <td>
            <input
              type="checkbox"
              [checked]="hasRole(role)"
              name="userRole{{ role }}"
            />
          </td>
        </tr>
        }
        <hr />
        @for (role of extraRoles; track $index) {
        <tr>
          <td>{{ role.name }}</td>
          <td>
            <input
              type="checkbox"
              [checked]="hasRole(role.name)"
              name="userRole{{ role.name }}"
            />
          </td>
        </tr>

        }
      </table>
    </div>
  </form>
  <div class="w-full sm:w-1/2">
    <img
      src="{{ selectedUser.profileImg }}"
      alt="{{ selectedUser.firstName }} profile"
    />
  </div>
</div>
